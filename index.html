<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHY1 · Übungsaufgaben</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        window.MathJax = { tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] } };
        // Apply saved theme before first paint to avoid a flash
        (function () {
            try {
                const t = localStorage.getItem('phy1-theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --paper: #F5F6F8;
            --surface: #FFFFFF;
            --ink: #1B2432;
            --ink-soft: #55606F;
            --line: #DCE0E6;
            --accent: #0E6B74;
            --accent-ink: #0B565E;
            --accent-wash: #E4F1F2;
            --hint: #9A6A10;
            --hint-wash: #FBF3E1;
            --focus: #0E6B74;
            --radius: 12px;
            --shadow: 0 1px 2px rgba(27, 36, 50, 0.06), 0 12px 32px -14px rgba(27, 36, 50, 0.22);
            --particle: 14, 107, 116;
        }
        :root[data-theme="dark"] {
            --paper: #15191F;
            --surface: #1E242C;
            --ink: #E8EBEF;
            --ink-soft: #A3ACB8;
            --line: #313943;
            --accent: #5FBFC6;
            --accent-ink: #8AD3D8;
            --accent-wash: #16343A;
            --hint: #E2B35A;
            --hint-wash: #35290F;
            --focus: #5FBFC6;
            --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.7);
            --particle: 95, 191, 198;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --paper: #15191F;
                --surface: #1E242C;
                --ink: #E8EBEF;
                --ink-soft: #A3ACB8;
                --line: #313943;
                --accent: #5FBFC6;
                --accent-ink: #8AD3D8;
                --accent-wash: #16343A;
                --hint: #E2B35A;
                --hint-wash: #35290F;
                --focus: #5FBFC6;
                --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.7);
                --particle: 95, 191, 198;
            }
        }

        * { box-sizing: border-box; }
        html { background: var(--paper); color: var(--ink); scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 17px;
            line-height: 1.55;
            min-height: 100vh;
            transition: background 300ms ease, color 300ms ease;
        }
        :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
        button { font: inherit; }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky; top: 0; z-index: 100;
            background: color-mix(in srgb, var(--paper) 86%, transparent);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .topbar-inner {
            max-width: 1040px; margin: 0 auto; padding: 12px 24px;
            display: flex; align-items: center; gap: 18px;
        }
        .brand {
            font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 22px;
            letter-spacing: -0.01em; color: var(--ink);
            background: none; border: 0; padding: 0; cursor: pointer; line-height: 1; text-align: left;
        }
        .brand small {
            display: block; font-family: "IBM Plex Sans", sans-serif; font-weight: 400;
            font-size: 13px; color: var(--ink-soft); margin-top: 4px;
        }
        .topbar-context { margin-left: auto; display: none; align-items: center; gap: 14px; }
        body.showing-questions .topbar-context { display: flex; }
        body.showing-questions .theme-toggle { margin-left: 8px; }
        #weekTitle { margin: 0; font-weight: 500; font-size: 15px; color: var(--ink); }
        .progress { width: 120px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
        .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 300ms cubic-bezier(.2,.8,.2,1); }

        .theme-toggle {
            margin-left: auto; width: 38px; height: 38px; border-radius: 50%;
            border: 1px solid var(--line); background: var(--surface); color: var(--ink);
            cursor: pointer; display: grid; place-items: center; padding: 0;
            transition: transform 300ms cubic-bezier(.2,.8,.2,1), border-color 150ms;
        }
        .theme-toggle:hover { border-color: var(--accent); transform: rotate(25deg); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle .moon { display: none; }
        :root[data-theme="dark"] .theme-toggle .sun { display: none; }
        :root[data-theme="dark"] .theme-toggle .moon { display: block; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .theme-toggle .sun { display: none; }
            :root:not([data-theme="light"]) .theme-toggle .moon { display: block; }
        }

        /* ---------- Home ---------- */
        .home { display: block; }
        body.showing-questions .home { display: none; }

        .hero {
            position: relative; overflow: hidden;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, var(--surface), var(--paper));
        }
        .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .hero-inner {
            position: relative; max-width: 1040px; margin: 0 auto;
            min-height: clamp(380px, 52vh, 560px);
            padding: 64px 24px; pointer-events: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        /* soft lens behind the text so it stays legible over the dense molecule field */
        .hero-inner::before {
            content: ""; position: absolute; inset: 0; z-index: -1;
            background: radial-gradient(ellipse 48% 60% at 50% 50%, color-mix(in srgb, var(--surface) 82%, transparent), transparent 70%);
        }
        .hero .eyebrow {
            font-size: 13px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
            color: var(--accent); margin: 0 0 18px;
        }
        .hero h1 {
            font-family: "Fraunces", Georgia, serif; font-weight: 500;
            font-size: clamp(40px, 6.5vw, 76px); line-height: 1.0; letter-spacing: -0.025em;
            margin: 0 0 18px; max-width: 16ch;
        }
        .hero p.lead { margin: 0; color: var(--ink-soft); max-width: 46ch; font-size: 19px; }
        .hero .cta {
            pointer-events: auto; margin-top: 30px;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 22px; border-radius: 999px; border: 1px solid var(--accent);
            background: var(--accent); color: #fff; font-weight: 500; font-size: 15px; cursor: pointer;
            transition: background 150ms, transform 150ms;
        }
        .hero .cta:hover { background: var(--accent-ink); transform: translateY(-1px); }
        :root[data-theme="dark"] .hero .cta { color: #0F1A1C; }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero .cta { color: #0F1A1C; } }

        .weeks { max-width: 1040px; margin: 0 auto; padding: 40px 24px 90px; }
        .weeks h2 {
            font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 24px;
            margin: 0 0 18px; letter-spacing: -0.01em;
        }
        .links {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
        }
        .link {
            position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 132px; padding: 18px 20px;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
            cursor: pointer; text-align: left; color: var(--ink);
            transition: border-color 150ms ease, transform 200ms cubic-bezier(.2,.8,.2,1), box-shadow 200ms ease;
            opacity: 0; transform: translateY(14px);
        }
        .link.in { opacity: 1; transform: none; }
        .link:hover, .link:focus-visible { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow); }
        .link .week {
            font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 32px;
            line-height: 1; letter-spacing: -0.02em;
        }
        .link .week em {
            font-style: normal; font-family: "IBM Plex Sans", sans-serif; font-weight: 400;
            font-size: 14px; color: var(--ink-soft); margin-right: 6px; vertical-align: 5px;
        }
        .link .topic { font-size: 15px; color: var(--ink-soft); margin-top: 14px; }

        /* ---------- Question view ---------- */
        .question-box { display: none; max-width: 820px; margin: 0 auto; padding: 36px 24px 150px; }
        body.showing-questions .question-box { display: block; }

        .question-frame {
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 28px 32px 24px;
            animation: card-in 320ms cubic-bezier(.2,.8,.2,1);
        }
        @keyframes card-in { from { opacity: 0; transform: translateY(10px) scale(.995); } to { opacity: 1; transform: none; } }

        .q-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
        .question-frame h2 {
            font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 28px;
            letter-spacing: -0.01em; margin: 0;
        }
        .stars { display: inline-flex; gap: 2px; color: var(--hint); font-size: 15px; letter-spacing: 1px; }
        .stars[title] { cursor: help; }

        .question-frame p { margin: 0 0 1em; }
        .question-frame p:last-child { margin-bottom: 0; }
        .question-frame figure { margin: 1.2em 0; text-align: center; }
        .question-frame img { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 6px; }
        .question-frame figcaption { font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
        .question-frame table { border-collapse: collapse; margin: 1em 0; }
        .question-frame td, .question-frame th { padding: 6px 12px; border-bottom: 1px solid var(--line); }
        mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; }

        .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
        .pill {
            font-weight: 500; font-size: 15px; cursor: pointer; border-radius: 999px;
            border: 1px solid var(--line); background: var(--surface); color: var(--ink);
            padding: 9px 18px; display: inline-flex; align-items: center; gap: 8px;
            transition: background 150ms ease, border-color 150ms ease, color 150ms ease, transform 120ms ease;
        }
        .pill:hover:not(:disabled) { border-color: var(--ink-soft); }
        .pill:active:not(:disabled) { transform: scale(.97); }
        .pill:disabled { opacity: .4; cursor: default; }
        .pill kbd {
            font: 500 11px/1 "IBM Plex Sans", sans-serif; color: var(--ink-soft);
            border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; background: var(--paper);
        }
        .hint-btn { color: var(--hint); border-color: color-mix(in srgb, var(--hint) 40%, var(--line)); }
        .hint-btn:hover, .hint-btn.is-open { background: var(--hint-wash); border-color: var(--hint); }
        .solution-btn { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
        .solution-btn:hover, .solution-btn.is-open { background: var(--accent-wash); border-color: var(--accent); }

        /* Animated reveal panels */
        .reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 320ms cubic-bezier(.2,.8,.2,1); }
        .reveal.open { grid-template-rows: 1fr; }
        .reveal > div { overflow: hidden; }
        .hint-frame, .solution-frame {
            margin-top: 18px; padding: 18px 22px; border-radius: 8px; border-left: 4px solid;
            opacity: 0; transform: translateY(-6px); transition: opacity 280ms ease 60ms, transform 280ms ease 60ms;
        }
        .reveal.open .hint-frame, .reveal.open .solution-frame { opacity: 1; transform: none; }
        .hint-frame { background: var(--hint-wash); border-color: var(--hint); }
        .solution-frame { background: var(--accent-wash); border-color: var(--accent); }
        .hint-frame::before, .solution-frame::before { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
        .hint-frame::before { content: "Hinweis"; color: var(--hint); }
        .solution-frame::before { content: "Lösung"; color: var(--accent-ink); }
        .hint-frame p:last-child, .solution-frame p:last-child { margin-bottom: 0; }

        /* Question dots */
        .dots { display: flex; justify-content: center; gap: 8px; margin: 26px 0 0; flex-wrap: wrap; }
        .dot-btn {
            width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
            background: var(--line); transition: transform 160ms, background 160ms;
        }
        .dot-btn:hover { transform: scale(1.3); }
        .dot-btn.current { background: var(--accent); transform: scale(1.35); }

        /* ---------- Bottom navigation ---------- */
        .navigation {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: color-mix(in srgb, var(--paper) 88%, transparent);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--line);
        }
        body.showing-questions .navigation { display: block; }
        .navigation-inner { max-width: 820px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 10px; }
        .nav-buttons { display: flex; gap: 8px; }
        .nav-buttons.right-buttons { margin-left: auto; }
        .current-question { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 15px; margin: 0 8px; }
        #nextBtn, #prevBtn { background: var(--accent); border-color: var(--accent); color: #fff; }
        :root[data-theme="dark"] #nextBtn, :root[data-theme="dark"] #prevBtn { color: #0F1A1C; }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #nextBtn, :root:not([data-theme="light"]) #prevBtn { color: #0F1A1C; } }
        #nextBtn:hover:not(:disabled), #prevBtn:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }

        /* ---------- Missing week ---------- */
        .missing-week-message {
            display: none; max-width: 560px; margin: 80px auto; padding: 0 24px;
            text-align: center; color: var(--ink-soft); font-size: 19px;
        }
        .missing-week-message img { max-width: 100%; height: auto; margin: 0 auto 20px; display: block; }


        /* ---------- Small screens ---------- */
        @media (max-width: 640px) {
            body { font-size: 16px; }
            .topbar-inner { padding: 10px 16px; }
            .progress { display: none; }
            .hero-inner { padding: 48px 16px 40px; min-height: 320px; }
            .weeks { padding: 28px 16px 60px; }
            .question-box { padding: 20px 12px 170px; }
            .question-frame { padding: 20px 18px 18px; }
            .navigation-inner { flex-wrap: wrap; padding: 10px 12px; }
            .nav-buttons.left-buttons { order: 2; width: 100%; }
            .nav-buttons.right-buttons { order: 1; margin-left: auto; }
            .current-question { order: 0; }
            #firstQuestionBtn { display: none !important; }
            .pill kbd { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
            .link { opacity: 1; transform: none; }
        }
    </style>
</head>
<body class="showing-links">

    <header class="topbar">
        <div class="topbar-inner">
            <button class="brand" id="pageTitle" onclick="showHomepage()" aria-label="Zur Übersicht">PHY1<small>Übungsaufgaben</small></button>
            <div class="topbar-context">
                <h2 id="weekTitle">Physik Grundlagen</h2>
                <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Helles oder dunkles Design" title="Design wechseln">
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </div>
    </header>

    <!-- Home -->
    <main class="home">
        <section class="hero">
            <canvas id="gas" aria-hidden="true"></canvas>
            <div class="hero-inner">
                <p class="eyebrow">PHY1 · Physik 1</p>
                <h1>Aufgaben nach Woche</h1>
                <p class="lead">Wähle eine Woche. Jede Aufgabe hat einen Hinweis und eine vollständige Lösung.</p>
                <button class="cta" onclick="document.querySelector('.weeks').scrollIntoView({behavior:'smooth'})">Zu den Wochen ↓</button>
            </div>
        </section>
        <section class="weeks">
            <h2>Wochen</h2>
            <div class="links" id="weekGrid"></div>
        </section>
    </main>

    <!-- Question view -->
    <section id="weekContent" class="question-box">
        <div id="questionsContainer"></div>
        <div class="dots" id="dots"></div>
    </section>

    <div id="missingWeekMessage" class="missing-week-message"></div>

    <nav class="navigation">
        <div class="navigation-inner">
            <div class="nav-buttons left-buttons">
                <button class="pill" id="homeBtn" onclick="showHomepage()">Alle Wochen</button>
                <button class="pill" id="firstQuestionBtn" onclick="goToFirstQuestion()">Erste Aufgabe</button>
                <button class="pill" id="downloadPdfBtn" onclick="downloadPdf()" style="display: none;">PDF</button>
            </div>
            <span id="questionNumber" class="current-question">1/5</span>
            <div class="nav-buttons right-buttons">
                <button class="pill" id="prevBtn" onclick="prevQuestion()" disabled>Zurück</button>
                <button class="pill" id="nextBtn" onclick="nextQuestion()">Weiter</button>
            </div>
        </div>
    </nav>


    <script>
        /* ---------------- Data ---------------- */
        const weeks = [
            { n: 2,  label: '2',       title: 'Physik Grundlagen' },
            { n: 3,  label: '3',       title: 'Impuls' },
            { n: 4,  label: '4',       title: 'Impuls, Raketen' },
            { n: 5,  label: '5',       title: 'Kinematik und Dynamik' },
            { n: 6,  label: '6',       title: 'Kinematik und Dynamik' },
            { n: 7,  label: '7',       title: 'Kinematik und Dynamik' },
            { n: 8,  label: '8',       title: 'Physik Grundlagen' },
            { n: 9,  label: '9',       title: 'Kräfte' },
            { n: 10, label: '10',      title: 'Kräfte' },
            { n: 11, label: '11 + 12', title: 'Energie, Leistung und Arbeit' },
            { n: 13, label: '13',      title: 'Schwingungen' },
        ];
        const weekTitles = Object.fromEntries(weeks.map(w => [w.n, w.title]));

        let currentQuestion = 1;
        let totalQuestions = 0;
        let currentWeek = 0;


        /* ---------------- Theme ---------------- */
        function toggleTheme() {
            const root = document.documentElement;
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const current = root.dataset.theme || (systemDark ? 'dark' : 'light');
            const next = current === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            try { localStorage.setItem('phy1-theme', next); } catch (e) {}
        }

        /* ---------------- Home: week grid ---------------- */
        function renderWeekGrid() {
            const grid = document.getElementById('weekGrid');
            grid.innerHTML = weeks.map(w => `
                    <button class="link" onclick="showQuestions(${w.n})">
                        <span class="week"><em>Woche</em>${w.label}</span>
                        <span class="topic">${w.title}</span>
                    </button>`).join('');

            // Staggered entrance
            grid.querySelectorAll('.link').forEach((c, i) => setTimeout(() => c.classList.add('in'), 40 + i * 45));
        }

        /* ---------------- Questions ---------------- */
        function getContentUntilNext(element) {
            let content = '';
            let sibling = element.nextElementSibling;
            while (sibling &&
                   !(sibling.tagName === 'H2' && sibling.id && sibling.id.startsWith('question')) &&
                   !(sibling.id && (sibling.id.startsWith('hint-') || sibling.id.startsWith('solution-')))) {
                content += sibling.outerHTML;
                sibling = sibling.nextElementSibling;
            }
            return content;
        }

        // Pull leading ★★ out of the question text and return [stars, cleanedHTML]
        function extractStars(html) {
            const wrap = document.createElement('div');
            wrap.innerHTML = html;
            const first = wrap.querySelector('p');
            if (!first) return [0, html];
            const m = first.innerHTML.match(/^\s*<span class="math inline">\\\(((?:\\star)+)\\\)<\/span>\s*/);
            if (!m) return [0, html];
            const stars = (m[1].match(/\\star/g) || []).length;
            first.innerHTML = first.innerHTML.slice(m[0].length);
            return [stars, wrap.innerHTML];
        }

        const difficulty = { 1: 'Grundlagen', 2: 'Mittel', 3: 'Anspruchsvoll', 4: 'Vertiefung' };

        function loadQuestions(weekNumber) {
            currentWeek = weekNumber;
            document.getElementById('weekTitle').innerText = weekTitles[weekNumber] || 'Physik Grundlagen';

            fetch(`Week${weekNumber}_questions.html`)
                .then(r => { if (!r.ok) throw new Error('File not found'); return r.text(); })
                .then(data => {
                    const doc = new DOMParser().parseFromString(data, 'text/html');
                    const questions = doc.querySelectorAll('h2[id^="question"]');
                    let html = '';

                    questions.forEach((question, index) => {
                        const n = index + 1;
                        const hint = doc.querySelector(`#hint-${n}`);
                        const solution = doc.querySelector(`#solution-${n}`);
                        const [stars, qContent] = extractStars(getContentUntilNext(question));
                        const hintContent = hint ? getContentUntilNext(hint) : '';
                        const solContent = solution ? getContentUntilNext(solution) : '';

                        html += `
                            <article class="question-frame" id="question${n}" style="display:none;">
                                <div class="q-head">
                                    <h2>Aufgabe ${n}</h2>
                                    ${stars ? `<span class="stars" title="${difficulty[stars] || stars + ' Sterne'}">${'★'.repeat(stars)}</span>` : ''}
                                </div>
                                ${qContent}
                                <div class="buttons">
                                    ${hintContent.trim() ? `<button class="pill hint-btn" data-target="hint${n}">Hinweis anzeigen <kbd>H</kbd></button>` : ''}
                                    <button class="pill solution-btn" data-target="solution${n}">Lösung anzeigen <kbd>L</kbd></button>
                                </div>
                                <div class="reveal" id="hint${n}"><div><div class="hint-frame">${hintContent}</div></div></div>
                                <div class="reveal" id="solution${n}"><div><div class="solution-frame">${solContent}</div></div></div>
                            </article>`;
                    });

                    document.getElementById('questionsContainer').innerHTML = html;
                    totalQuestions = questions.length;

                    if (totalQuestions === 0) { handleMissingWeek(weekNumber); return; }

                    renderDots();
                    updateQuestionDisplay();
                    bindButtonEvents();
                    if (window.MathJax && MathJax.typesetPromise) {
                        MathJax.typesetPromise([document.getElementById('questionsContainer')]);
                    }
                    ['firstQuestionBtn', 'prevBtn', 'nextBtn', 'questionNumber', 'downloadPdfBtn', 'weekContent']
                        .forEach(id => document.getElementById(id).style.display = '');
                    document.getElementById('missingWeekMessage').style.display = 'none';
                })
                .catch(() => handleMissingWeek(weekNumber));
        }

        function handleMissingWeek(weekNumber) {
            fetch(`Woche${weekNumber}.png`)
                .then(r => r.ok ? displayImageMessage(`Woche${weekNumber}.png`, '')
                                : displayImageMessage('under.png', `Wird in Woche ${weekNumber} hochgeladen`))
                .catch(() => displayImageMessage('under.png', `Wird in Woche ${weekNumber} hochgeladen`));
        }

        function displayImageMessage(imageSrc, message) {
            document.getElementById('questionsContainer').innerHTML = '';
            document.getElementById('dots').innerHTML = '';
            document.getElementById('weekContent').style.display = 'none';
            const box = document.getElementById('missingWeekMessage');
            box.innerHTML = `<img src="${imageSrc}" alt="">${message ? `<div>${message}</div>` : ''}`;
            box.style.display = 'block';
            ['firstQuestionBtn', 'downloadPdfBtn', 'prevBtn', 'nextBtn', 'questionNumber']
                .forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById('progressBar').style.width = '0';
        }

        function bindButtonEvents() {
            document.querySelectorAll('.hint-btn, .solution-btn').forEach(btn => {
                btn.addEventListener('click', () => toggleReveal(btn));
            });
        }

        function toggleReveal(btn) {
            const panel = document.getElementById(btn.dataset.target);
            const open = panel.classList.toggle('open');
            btn.classList.toggle('is-open', open);
            const isHint = btn.classList.contains('hint-btn');
            const label = isHint ? (open ? 'Hinweis verbergen' : 'Hinweis anzeigen') : (open ? 'Lösung verbergen' : 'Lösung anzeigen');
            btn.innerHTML = `${label} <kbd>${isHint ? 'H' : 'L'}</kbd>`;
        }


        function renderDots() {
            const dots = document.getElementById('dots');
            dots.innerHTML = '';
            for (let i = 1; i <= totalQuestions; i++) {
                const b = document.createElement('button');
                b.className = 'dot-btn' + (i === currentQuestion ? ' current' : '');
                b.setAttribute('aria-label', `Aufgabe ${i}`);
                b.title = `Aufgabe ${i}`;
                b.onclick = () => { currentQuestion = i; updateQuestionDisplay(); window.scrollTo(0, 0); };
                dots.appendChild(b);
            }
        }

        function showQuestions(weekNumber) {
            currentQuestion = 1;
            document.body.classList.remove('showing-links');
            document.body.classList.add('showing-questions');
            document.getElementById('weekContent').style.display = '';
            document.getElementById('missingWeekMessage').style.display = 'none';
            window.scrollTo(0, 0);
            loadQuestions(weekNumber);
        }

        function showHomepage() {
            document.body.classList.remove('showing-questions');
            document.body.classList.add('showing-links');
            document.getElementById('missingWeekMessage').style.display = 'none';
            renderWeekGrid();
            window.scrollTo(0, 0);
        }

        function goToFirstQuestion() { currentQuestion = 1; updateQuestionDisplay(); window.scrollTo(0, 0); }

        function updateQuestionDisplay() {
            for (let i = 1; i <= totalQuestions; i++) {
                const el = document.getElementById(`question${i}`);
                const show = i === currentQuestion;
                if (show && el.style.display === 'none') {
                    el.style.display = 'block';
                    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
                } else if (!show) el.style.display = 'none';
            }
            document.getElementById('questionNumber').innerText = `${currentQuestion} / ${totalQuestions}`;
            document.getElementById('prevBtn').disabled = currentQuestion === 1;
            document.getElementById('nextBtn').disabled = currentQuestion === totalQuestions;
            document.getElementById('progressBar').style.width = `${(currentQuestion / totalQuestions) * 100}%`;
            document.querySelectorAll('.dot-btn').forEach((d, i) => d.classList.toggle('current', i + 1 === currentQuestion));
        }

        function prevQuestion() { if (currentQuestion > 1) { currentQuestion--; updateQuestionDisplay(); window.scrollTo(0, 0); } }
        function nextQuestion() { if (currentQuestion < totalQuestions) { currentQuestion++; updateQuestionDisplay(); window.scrollTo(0, 0); } }
        function downloadPdf() { if (currentWeek > 0) window.location.href = `Woche${currentWeek}_questions.pdf`; }

        /* ---------------- Keyboard ---------------- */
        document.addEventListener('keydown', e => {
            if (!document.body.classList.contains('showing-questions')) return;
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
            const frame = document.getElementById(`question${currentQuestion}`);
            if (!frame) return;
            const k = e.key.toLowerCase();
            if (e.key === 'ArrowRight') nextQuestion();
            else if (e.key === 'ArrowLeft') prevQuestion();
            else if (k === 'h') { const b = frame.querySelector('.hint-btn'); if (b) toggleReveal(b); }
            else if (k === 'l') { const b = frame.querySelector('.solution-btn'); if (b) toggleReveal(b); }
        });


        /* ---------------- Hero: gas molecules in a box ---------------- */
        (function gasBox() {
            const canvas = document.getElementById('gas');
            if (!canvas || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const ctx = canvas.getContext('2d');
            let w, h, dpr, mols = [], mouse = { x: -1e4, y: -1e4 };
            // Particle count scales with canvas area (one molecule per ~3600 px²), clamped for small/huge screens
            const DENSITY = 1 / 3600, MIN_N = 90, MAX_N = 320, LINK = 80;

            function makeMol() {
                const a = Math.random() * Math.PI * 2, s = 0.35 + Math.random() * 0.65;
                return { x: Math.random() * w, y: Math.random() * h, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 1.6 + Math.random() * 2.6 };
            }
            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = canvas.clientWidth; h = canvas.clientHeight;
                canvas.width = w * dpr; canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const target = Math.max(MIN_N, Math.min(MAX_N, Math.round(w * h * DENSITY)));
                while (mols.length < target) mols.push(makeMol());
                if (mols.length > target) mols.length = target;
                for (const m of mols) { m.x = Math.min(m.x, w - m.r); m.y = Math.min(m.y, h - m.r); }
            }
            function color() { return getComputedStyle(document.documentElement).getPropertyValue('--particle').trim() || '14,107,116'; }
            let rgb = color();
            new MutationObserver(() => rgb = color()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => rgb = color());

            function step() {
                ctx.clearRect(0, 0, w, h);
                for (const m of mols) {
                    // cursor pushes molecules away
                    const dx = m.x - mouse.x, dy = m.y - mouse.y, d2 = dx * dx + dy * dy;
                    if (d2 < 140 * 140) { const d = Math.sqrt(d2) || 1, f = (140 - d) / 140 * 0.35; m.vx += dx / d * f; m.vy += dy / d * f; }
                    // mild damping back toward thermal speed
                    const sp = Math.hypot(m.vx, m.vy); if (sp > 1.4) { m.vx *= .96; m.vy *= .96; }
                    m.x += m.vx; m.y += m.vy;
                    if (m.x < m.r) { m.x = m.r; m.vx *= -1; } if (m.x > w - m.r) { m.x = w - m.r; m.vx *= -1; }
                    if (m.y < m.r) { m.y = m.r; m.vy *= -1; } if (m.y > h - m.r) { m.y = h - m.r; m.vy *= -1; }
                }
                // links between close molecules + simple elastic bounce when they touch
                ctx.lineWidth = 1;
                for (let i = 0; i < mols.length; i++) for (let j = i + 1; j < mols.length; j++) {
                    const a = mols[i], b = mols[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
                    if (d2 >= LINK * LINK) continue;
                    const d = Math.sqrt(d2) || 1;
                    ctx.strokeStyle = `rgba(${rgb},${(1 - d / LINK) * .22})`;
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                    const minD = a.r + b.r;
                    if (d < minD) {
                        const nx = dx / d, ny = dy / d, p = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
                        if (p < 0) { a.vx -= p * nx; a.vy -= p * ny; b.vx += p * nx; b.vy += p * ny; }
                        const push = (minD - d) / 2; a.x += nx * push; a.y += ny * push; b.x -= nx * push; b.y -= ny * push;
                    }
                }
                for (const m of mols) { ctx.fillStyle = `rgba(${rgb},${.35 + m.r * .08})`; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill(); }
                requestAnimationFrame(step);
            }
            const hero = canvas.parentElement;
            hero.addEventListener('pointermove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
            hero.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; });
            window.addEventListener('resize', resize);
            resize(); step();
        })();

        /* ---------------- Init ---------------- */
        renderWeekGrid();
    </script>
</body>
</html>
