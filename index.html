<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHY1 · Übungsaufgaben</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <!-- MathJax for LaTeX equations -->
    <script>
        window.MathJax = { tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --paper: #F5F6F8;
            --surface: #FFFFFF;
            --ink: #1B2432;
            --ink-soft: #55606F;
            --line: #DCE0E6;
            --accent: #0E6B74;
            --accent-ink: #0B565E;
            --accent-wash: #E4F1F2;
            --hint: #9A6A10;
            --hint-wash: #FBF3E1;
            --focus: #0E6B74;
            --radius: 10px;
            --shadow: 0 1px 2px rgba(27, 36, 50, 0.06), 0 8px 24px -12px rgba(27, 36, 50, 0.18);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #15191F;
                --surface: #1E242C;
                --ink: #E8EBEF;
                --ink-soft: #A3ACB8;
                --line: #313943;
                --accent: #5FBFC6;
                --accent-ink: #8AD3D8;
                --accent-wash: #16343A;
                --hint: #E2B35A;
                --hint-wash: #35290F;
                --focus: #5FBFC6;
                --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.6);
            }
        }

        * { box-sizing: border-box; }

        html { background: var(--paper); color: var(--ink); }

        body {
            margin: 0;
            font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 17px;
            line-height: 1.55;
            min-height: 100vh;
        }

        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 3px;
        }

        /* ---------- Header ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--paper) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .topbar-inner {
            max-width: 1040px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .brand {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 600;
            font-size: 22px;
            letter-spacing: -0.01em;
            color: var(--ink);
            text-decoration: none;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            line-height: 1;
        }
        .brand small {
            display: block;
            font-family: "IBM Plex Sans", sans-serif;
            font-weight: 400;
            font-size: 13px;
            color: var(--ink-soft);
            margin-top: 4px;
            letter-spacing: 0;
        }
        .topbar-context {
            margin-left: auto;
            display: none;
            align-items: center;
            gap: 14px;
            color: var(--ink-soft);
            font-size: 15px;
        }
        body.showing-questions .topbar-context { display: flex; }
        #weekTitle {
            margin: 0;
            font-family: "IBM Plex Sans", sans-serif;
            font-weight: 500;
            font-size: 15px;
            color: var(--ink);
        }
        .progress {
            width: 120px;
            height: 4px;
            border-radius: 2px;
            background: var(--line);
            overflow: hidden;
        }
        .progress span {
            display: block;
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width 240ms ease;
        }

        /* ---------- Home: week grid ---------- */
        .home {
            max-width: 1040px;
            margin: 0 auto;
            padding: 56px 24px 80px;
        }
        .home h1 {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 500;
            font-size: clamp(34px, 5vw, 52px);
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin: 0 0 12px;
            max-width: 18ch;
        }
        .home p.lead {
            margin: 0 0 40px;
            color: var(--ink-soft);
            max-width: 56ch;
        }
        .links {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .link {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 124px;
            padding: 18px 20px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            cursor: pointer;
            text-align: left;
            font: inherit;
            color: var(--ink);
            transition: border-color 150ms ease, transform 150ms ease;
        }
        .link:hover, .link:focus-visible {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .link .week {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 600;
            font-size: 30px;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .link .week em {
            font-style: normal;
            font-family: "IBM Plex Sans", sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: var(--ink-soft);
            margin-right: 6px;
            vertical-align: 4px;
        }
        .link .topic {
            font-size: 15px;
            color: var(--ink-soft);
            margin-top: 14px;
        }
        body.showing-questions .home { display: none; }

        /* ---------- Question view ---------- */
        .question-box {
            display: none;
            max-width: 820px;
            margin: 0 auto;
            padding: 36px 24px 140px;
        }
        body.showing-questions .question-box { display: block; }

        .question-frame {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 32px 24px;
        }
        .question-frame h2 {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 500;
            font-size: 28px;
            letter-spacing: -0.01em;
            margin: 0 0 14px;
        }
        .question-frame p { margin: 0 0 1em; }
        .question-frame p:last-child { margin-bottom: 0; }
        .question-frame figure { margin: 1.2em 0; text-align: center; }
        .question-frame img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .question-frame figcaption { font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
        .question-frame table { border-collapse: collapse; margin: 1em 0; }
        .question-frame td, .question-frame th { padding: 6px 12px; border-bottom: 1px solid var(--line); }
        mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        button {
            font: inherit;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            padding: 9px 18px;
            transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
        }
        button:hover:not(:disabled) { border-color: var(--ink-soft); }
        button:disabled { opacity: 0.4; cursor: default; }

        .hint-btn { color: var(--hint); border-color: color-mix(in srgb, var(--hint) 40%, var(--line)); }
        .hint-btn:hover { background: var(--hint-wash); border-color: var(--hint); }
        .solution-btn { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
        .solution-btn:hover { background: var(--accent-wash); border-color: var(--accent); }
        .hint-btn.is-open { background: var(--hint-wash); border-color: var(--hint); }
        .solution-btn.is-open { background: var(--accent-wash); border-color: var(--accent); }

        .hint-frame, .solution-frame {
            display: none;
            margin-top: 18px;
            padding: 18px 22px;
            border-radius: 8px;
            border-left: 4px solid;
        }
        .hint-frame { background: var(--hint-wash); border-color: var(--hint); }
        .solution-frame { background: var(--accent-wash); border-color: var(--accent); }
        .hint-frame::before, .solution-frame::before {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .hint-frame::before { content: "Hinweis"; color: var(--hint); }
        .solution-frame::before { content: "Lösung"; color: var(--accent-ink); }
        .hint-frame p:last-child, .solution-frame p:last-child { margin-bottom: 0; }

        /* ---------- Bottom navigation ---------- */
        .navigation {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--paper) 90%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
        }
        body.showing-questions .navigation { display: block; }
        .navigation-inner {
            max-width: 820px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-buttons { display: flex; gap: 8px; }
        .nav-buttons.right-buttons { margin-left: auto; }
        .current-question {
            font-variant-numeric: tabular-nums;
            color: var(--ink-soft);
            font-size: 15px;
            margin: 0 8px;
        }
        #nextBtn, #prevBtn {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        @media (prefers-color-scheme: dark) {
            #nextBtn, #prevBtn { color: #0F1A1C; }
        }
        #nextBtn:hover:not(:disabled), #prevBtn:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }

        /* ---------- Missing-week message ---------- */
        .missing-week-message {
            display: none;
            max-width: 560px;
            margin: 80px auto;
            padding: 0 24px;
            text-align: center;
            color: var(--ink-soft);
            font-size: 19px;
        }
        .missing-week-message img { max-width: 100%; height: auto; margin: 0 auto 20px; display: block; }

        /* ---------- Small screens ---------- */
        @media (max-width: 640px) {
            body { font-size: 16px; }
            .topbar-inner { padding: 12px 16px; }
            .progress { display: none; }
            .home { padding: 36px 16px 60px; }
            .question-box { padding: 20px 12px 150px; }
            .question-frame { padding: 20px 18px 18px; }
            .navigation-inner { flex-wrap: wrap; padding: 10px 12px; }
            .nav-buttons.left-buttons { order: 2; width: 100%; }
            .nav-buttons.right-buttons { order: 1; margin-left: auto; }
            .current-question { order: 0; }
            #firstQuestionBtn { display: none !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body class="showing-links">

    <header class="topbar">
        <div class="topbar-inner">
            <button class="brand" id="pageTitle" onclick="showHomepage()" aria-label="Zur Übersicht">PHY1<small>Übungsaufgaben</small></button>
            <div class="topbar-context">
                <h2 id="weekTitle">Physik Grundlagen</h2>
                <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
            </div>
        </div>
    </header>

    <!-- Home: week overview -->
    <main class="home">
        <h1>Aufgaben nach Woche</h1>
        <p class="lead">Wähle eine Woche. Jede Aufgabe hat einen Hinweis und eine vollständige Lösung, die du bei Bedarf einblenden kannst.</p>
        <div class="links">
            <button class="link" onclick="showQuestions(2)"><span class="week"><em>Woche</em>2</span><span class="topic">Physik Grundlagen</span></button>
            <button class="link" onclick="showQuestions(3)"><span class="week"><em>Woche</em>3</span><span class="topic">Impuls</span></button>
            <button class="link" onclick="showQuestions(4)"><span class="week"><em>Woche</em>4</span><span class="topic">Impuls, Raketen</span></button>
            <button class="link" onclick="showQuestions(5)"><span class="week"><em>Woche</em>5</span><span class="topic">Kinematik und Dynamik</span></button>
            <button class="link" onclick="showQuestions(6)"><span class="week"><em>Woche</em>6</span><span class="topic">Kinematik und Dynamik</span></button>
            <button class="link" onclick="showQuestions(7)"><span class="week"><em>Woche</em>7</span><span class="topic">Kinematik und Dynamik</span></button>
            <button class="link" onclick="showQuestions(8)"><span class="week"><em>Woche</em>8</span><span class="topic">Physik Grundlagen</span></button>
            <button class="link" onclick="showQuestions(9)"><span class="week"><em>Woche</em>9</span><span class="topic">Kräfte</span></button>
            <button class="link" onclick="showQuestions(10)"><span class="week"><em>Woche</em>10</span><span class="topic">Kräfte</span></button>
            <button class="link" onclick="showQuestions(11)"><span class="week"><em>Woche</em>11 + 12</span><span class="topic">Energie, Leistung und Arbeit</span></button>
            <button class="link" onclick="showQuestions(13)"><span class="week"><em>Woche</em>13</span><span class="topic">Physik Grundlagen</span></button>
        </div>
    </main>

    <!-- Question content -->
    <section id="weekContent" class="question-box">
        <div id="questionsContainer"></div>
    </section>

    <!-- Message when week content is missing -->
    <div id="missingWeekMessage" class="missing-week-message"></div>

    <!-- Bottom navigation -->
    <nav class="navigation">
        <div class="navigation-inner">
            <div class="nav-buttons left-buttons">
                <button id="homeBtn" onclick="showHomepage()">Alle Wochen</button>
                <button id="firstQuestionBtn" onclick="goToFirstQuestion()">Erste Aufgabe</button>
                <button id="downloadPdfBtn" onclick="downloadPdf()" style="display: none;">PDF</button>
            </div>
            <span id="questionNumber" class="current-question">1/5</span>
            <div class="nav-buttons right-buttons">
                <button id="prevBtn" onclick="prevQuestion()" disabled>Zurück</button>
                <button id="nextBtn" onclick="nextQuestion()">Weiter</button>
            </div>
        </div>
    </nav>

    <script>
        let currentQuestion = 1;
        let totalQuestions = 0;
        let currentWeek = 0;

        const weekTitles = {
            2: 'Physik Grundlagen',
            3: 'Impuls',
            4: 'Impuls-Raketen',
            5: 'Kinematik und Dynamik',
            6: 'Kinematik und Dynamik',
            7: 'Kinematik und Dynamik',
            9: 'Kräfte',
            10: 'Kräfte',
            11: 'Energie, Leistung und Arbeit',
        };

        // Collect all content until the next question, hint, or solution heading
        function getContentUntilNext(element) {
            let content = '';
            let sibling = element.nextElementSibling;
            while (sibling &&
                   !(sibling.tagName === 'H2' && sibling.id && sibling.id.startsWith('question')) &&
                   !(sibling.id && (sibling.id.startsWith('hint-') || sibling.id.startsWith('solution-')))) {
                content += sibling.outerHTML;
                sibling = sibling.nextElementSibling;
            }
            return content;
        }

        function loadQuestions(weekNumber) {
            currentWeek = weekNumber;
            document.getElementById('weekTitle').innerText = weekTitles[weekNumber] || 'Physik Grundlagen';

            fetch(`Week${weekNumber}_questions.html`)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(data => {
                    const doc = new DOMParser().parseFromString(data, 'text/html');
                    const questions = doc.querySelectorAll('h2[id^="question"]');
                    let questionHTML = '';

                    questions.forEach((question, index) => {
                        const n = index + 1;
                        const hint = doc.querySelector(`#hint-${n}`);
                        const solution = doc.querySelector(`#solution-${n}`);
                        const questionContent = getContentUntilNext(question);
                        const hintContent = hint ? getContentUntilNext(hint) : '';
                        const solutionContent = solution ? getContentUntilNext(solution) : '';

                        questionHTML += `
                            <article class="question-frame" id="question${n}" style="display:none;">
                                <h2>Aufgabe ${n}</h2>
                                ${questionContent}
                                <div class="buttons">
                                    ${hintContent.trim() ? `<button class="hint-btn" data-hint-id="hint${n}">Hinweis anzeigen</button>` : ''}
                                    <button class="solution-btn" data-solution-id="solution${n}">Lösung anzeigen</button>
                                </div>
                                <div id="hint${n}" class="hint-frame hint">${hintContent}</div>
                                <div id="solution${n}" class="solution-frame solution">${solutionContent}</div>
                            </article>`;
                    });

                    document.getElementById('questionsContainer').innerHTML = questionHTML;
                    totalQuestions = questions.length;

                    if (totalQuestions === 0) {
                        handleMissingWeek(weekNumber);
                    } else {
                        updateQuestionDisplay();
                        bindButtonEvents();
                        if (window.MathJax && MathJax.typesetPromise) {
                            MathJax.typesetPromise([document.getElementById('questionsContainer')]);
                        }

                        document.getElementById('firstQuestionBtn').style.display = '';
                        document.getElementById('prevBtn').style.display = '';
                        document.getElementById('nextBtn').style.display = '';
                        document.getElementById('questionNumber').style.display = '';
                        document.getElementById('missingWeekMessage').style.display = 'none';
                        document.getElementById('weekContent').style.display = '';
                        document.getElementById('downloadPdfBtn').style.display = '';
                    }
                })
                .catch(() => handleMissingWeek(weekNumber));
        }

        function handleMissingWeek(weekNumber) {
            fetch(`Woche${weekNumber}.png`)
                .then(response => {
                    if (response.ok) displayImageMessage(`Woche${weekNumber}.png`, '');
                    else displayImageMessage('under.png', `Wird in Woche ${weekNumber} hochgeladen`);
                })
                .catch(() => displayImageMessage('under.png', `Wird in Woche ${weekNumber} hochgeladen`));
        }

        function displayImageMessage(imageSrc, message) {
            document.getElementById('questionsContainer').innerHTML = '';
            document.getElementById('weekContent').style.display = 'none';

            const box = document.getElementById('missingWeekMessage');
            box.innerHTML = `<img src="${imageSrc}" alt="">${message ? `<div>${message}</div>` : ''}`;
            box.style.display = 'block';

            document.getElementById('firstQuestionBtn').style.display = 'none';
            document.getElementById('downloadPdfBtn').style.display = 'none';
            document.getElementById('prevBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('questionNumber').style.display = 'none';
            document.getElementById('progressBar').style.width = '0';
        }

        function bindButtonEvents() {
            document.querySelectorAll('.hint-btn').forEach(button => {
                button.addEventListener('click', function () {
                    const open = toggleDisplay(this.getAttribute('data-hint-id'));
                    this.innerText = open ? 'Hinweis verbergen' : 'Hinweis anzeigen';
                    this.classList.toggle('is-open', open);
                });
            });
            document.querySelectorAll('.solution-btn').forEach(button => {
                button.addEventListener('click', function () {
                    const open = toggleDisplay(this.getAttribute('data-solution-id'));
                    this.innerText = open ? 'Lösung verbergen' : 'Lösung anzeigen';
                    this.classList.toggle('is-open', open);
                });
            });
        }

        // Returns true if the element is now visible
        function toggleDisplay(elementId) {
            const el = document.getElementById(elementId);
            const open = el.style.display !== 'block';
            el.style.display = open ? 'block' : 'none';
            return open;
        }

        function showQuestions(weekNumber) {
            currentQuestion = 1;
            document.body.classList.remove('showing-links');
            document.body.classList.add('showing-questions');
            document.getElementById('weekContent').style.display = '';
            document.getElementById('missingWeekMessage').style.display = 'none';
            window.scrollTo(0, 0);
            loadQuestions(weekNumber);
        }

        function showHomepage() {
            document.body.classList.remove('showing-questions');
            document.body.classList.add('showing-links');
            document.getElementById('missingWeekMessage').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function goToFirstQuestion() {
            currentQuestion = 1;
            updateQuestionDisplay();
            window.scrollTo(0, 0);
        }

        function updateQuestionDisplay() {
            for (let i = 1; i <= totalQuestions; i++) {
                document.getElementById(`question${i}`).style.display = (i === currentQuestion) ? 'block' : 'none';
            }
            document.getElementById('questionNumber').innerText = `${currentQuestion} / ${totalQuestions}`;
            document.getElementById('prevBtn').disabled = (currentQuestion === 1);
            document.getElementById('nextBtn').disabled = (currentQuestion === totalQuestions);
            document.getElementById('progressBar').style.width = `${(currentQuestion / totalQuestions) * 100}%`;
        }

        function prevQuestion() {
            if (currentQuestion > 1) { currentQuestion--; updateQuestionDisplay(); window.scrollTo(0, 0); }
        }

        function nextQuestion() {
            if (currentQuestion < totalQuestions) { currentQuestion++; updateQuestionDisplay(); window.scrollTo(0, 0); }
        }

        function downloadPdf() {
            if (currentWeek > 0) window.location.href = `Woche${currentWeek}_questions.pdf`;
        }

        // Keyboard: ← → to move between questions
        document.addEventListener('keydown', e => {
            if (!document.body.classList.contains('showing-questions')) return;
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
        });
    </script>

</body>
</html>
